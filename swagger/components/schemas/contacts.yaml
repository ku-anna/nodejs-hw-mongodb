type: object
required:
  - _id
  - name
  - email
  - phone
  - favorite
properties:
  _id:
    type: string
    description: Contact id
    example: 6714b5d9e2a6a07f42b5e123
  name:
    type: string
    example: John Doe
  email:
    type: string
    format: email
    example: john.doe@example.com
  phone:
    type: string
    example: '+380931234567'
  favorite:
    type: boolean
    example: false
  owner:
    type: string
    description: User id who owns the contact
    example: 6714b5d9e2a6a07f42b5e101
