tags:
  - Auth
summary: Refresh access token
operationId: refreshToken
description: Get new access and refresh tokens using valid refresh token
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [refreshToken]
        properties:
          refreshToken:
            type: string
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
responses:
  '200':
    description: Tokens refreshed successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Tokens refreshed
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: eyJh...
                refreshToken:
                  type: string
                  example: eyJb...
  '401':
    description: Invalid or expired refresh token
