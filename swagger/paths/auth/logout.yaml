tags:
  - Auth
summary: Logout user
operationId: logoutUser
description: Invalidate user's refresh token
security:
  - bearerAuth: []
responses:
  '200':
    description: Logout successful
    content:
      application/json:
        schema:
          type: object
          required: [status, message]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Logout successful
  '401':
    description: Unauthorized
