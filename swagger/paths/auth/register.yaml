tags:
  - Auth
summary: Register new user
operationId: registerUser
description: Create a new user account
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email, password]
        properties:
          email:
            type: string
            format: email
            example: 'user@example.com'
          password:
            type: string
            minLength: 6
            example: 'qwerty123'
responses:
  '201':
    description: User successfully registered
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Registration successful!
            data:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    _id:
                      type: string
                      example: 65f7a21ef5a2b30012c54d8b
                    email:
                      type: string
                      example: user@example.com
  '409':
    description: Email already exists
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: Email already in use
