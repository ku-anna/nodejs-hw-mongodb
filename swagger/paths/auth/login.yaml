tags:
  - Auth
summary: Login user
operationId: loginUser
description: Authenticate user and issue tokens
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email, password]
        properties:
          email:
            type: string
            example: 'user@example.com'
          password:
            type: string
            example: 'qwerty123'
responses:
  '200':
    description: User successfully logged in
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Login successful
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: user@example.com
  '401':
    description: Invalid credentials
