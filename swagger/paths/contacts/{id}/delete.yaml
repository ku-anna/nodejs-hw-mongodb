tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContact
description: 'Delete a contact from the database by its ID'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65f7a21ef5a2b30012c54d8b'
responses:
  '200':
    description: Contact deleted successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully deleted contact!
  '401':
    $ref: '../../../components/responses/401.yaml'
