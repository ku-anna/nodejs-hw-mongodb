tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update existing contact fields
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65f7a21ef5a2b30012c54d8b'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Updated'
          phone:
            type: string
            example: '+380991234999'
          favorite:
            type: boolean
            example: true
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact!
            data:
              $ref: '../../../components/schemas/contacts.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
