tags:
  - Contacts
summary: Update an existing contact by ID
operationId: updateContact
description: Update one or more fields of a contact by its ID
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '6714b5d9e2a6a07f42b5e123'
    description: The unique ID of the contact to update

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'John Doe'
          phoneNumber:
            type: string
            description: "Contact's phone number"
            example: '+380931234567'
          email:
            type: string
            format: email
            description: "Contact's email address"
            example: 'john.doe@example.com'
          contactType:
            type: string
            description: 'Type of contact'
            enum: [home, personal, work]
            example: 'work'
          isFavourite:
            type: boolean
            description: 'Mark contact as favourite'
            example: true
          photo:
            type: string
            format: binary
            description: 'Optional updated contact photo'

responses:
  '200':
    description: Successfully updated contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact!
            data:
              $ref: '../../../components/schemas/contacts.yaml'

  '400':
    description: Bad request (invalid data)
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Invalid update data'
            data:
              type: object
              example: {}
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
