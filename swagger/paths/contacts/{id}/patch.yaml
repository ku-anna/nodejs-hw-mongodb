tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update existing contact fields by ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '6714b5d9e2a6a07f42b5e123'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          email:
            type: string
            format: email
            example: 'johndoe@example.com'
          phone:
            type: string
            example: '+380991112233'
          favorite:
            type: boolean
            example: true
responses:
  '200':
    description: Successfully updated a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact!
            data:
              $ref: '../../../components/schemas/contacts.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
