tags:
  - Contacts
summary: Update an existing contact by ID
operationId: updateContact
description: Update one or more fields of a contact by its ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '6714b5d9e2a6a07f42b5e123'
    description: The unique ID of the contact to update
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Updated contact name'
          email:
            type: string
            format: email
            example: 'updated@example.com'
          phoneNumber:
            type: string
            example: '+380991112233'
          contactType:
            type: string
            example: 'business'
          isFavourite:
            type: boolean
            example: true
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully
            data:
              $ref: '../../../components/schemas/contacts.yaml'

  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
