tags:
  - Contacts
summary: Update an existing contact by ID
operationId: updateContact
description: Update one or more fields of a contact by its ID
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '6714b5d9e2a6a07f42b5e123'
    description: The unique ID of the contact to update

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: '../../../components/schemas/contacts.yaml'

responses:
  '204':
    $ref: '../../../components/responses/204.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
