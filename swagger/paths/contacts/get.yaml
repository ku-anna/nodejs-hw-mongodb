tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: Get list of contacts with pagination, filtering and sorting.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: limit
    schema:
      type: integer
      example: 10
  - in: query
    name: favorite
    schema:
      type: boolean
      example: true
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required: [contacts, page, limit, totalPages]
              properties:
                contacts:
                  type: array
                  items:
                    $ref: '../../components/schemas/contacts.yaml'
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 10
                totalPages:
                  type: integer
                  example: 3
  '401':
    $ref: '../../components/responses/401.yaml'
